name: Verify Peak
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_USER: peak
          POSTGRES_PASSWORD: local-only-test-password
          POSTGRES_DB: peak_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peak -d peak_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.19
          python-version: '3.12'
      - run: uv sync --frozen
        working-directory: services/backend
      - run: uv run pytest -q && uv run ruff check peak tests
        working-directory: services/backend
      - run: uv run alembic upgrade head && uv run alembic check
        working-directory: services/backend
      - run: uv run alembic upgrade head && uv run alembic check && uv run pytest -q
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+psycopg://peak:local-only-test-password@127.0.0.1:5432/peak_test
          PEAK_TEST_DATABASE_URL: postgresql+psycopg://peak:local-only-test-password@127.0.0.1:5432/peak_test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: apps/web
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - path: services/backend
            name: peak-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/thematthewturner/${{ matrix.name }}:${{ github.sha }}
      - name: Export verified CI image for SSH delivery
        env:
          IMAGE: ghcr.io/thematthewturner/${{ matrix.name }}:${{ github.sha }}
          REVISION: ${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          mkdir image-export
          docker save "$IMAGE" | gzip > image-export/image.tar.gz
          cd image-export
          sha256sum image.tar.gz > archive.sha256
          printf '%s\n' "$REVISION" > revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: image-export/
          retention-days: 7
