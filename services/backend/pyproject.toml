[project]
name = "peak-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.9",
  "pillow>=11",
  "pillow-heif>=0.20",
  "alembic>=1.13",
  "anthropic>=0.40",
  "pymupdf>=1.24",
  "sympy>=1.13",
  "fsrs>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["peak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
