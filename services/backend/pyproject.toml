[project]
name = "peak"
version = "0.1.0"
description = "Peak: SAT prep for Addison"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0", "alembic>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["peak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
